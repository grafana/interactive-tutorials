apiVersion: 1

# Enables Pathfinder developer mode from provisioning, which is what makes the
# plugin trust http://localhost content served by this harness. Requires
# grafana/grafana-pathfinder-app#2285 (a provisioned devModeOptIn is honoured as
# the instance default). Without that PR, developer mode must be toggled per
# user in the browser at /plugins/grafana-pathfinder-app?dev=true.
apps:
  - type: grafana-pathfinder-app
    org_id: 1
    disabled: false
    jsonData:
      devMode: true
      devModeOptIn: true
