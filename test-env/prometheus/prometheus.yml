global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # One node_exporter scraped under three environment/cluster/region groups so
  # the Metrics Drilldown breakdown steps have label values to drill on.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          environment: production
          cluster: us-central-0
          region: us-central
          instance: node-prod-1
      - targets: ["node-exporter:9100"]
        labels:
          environment: staging
          cluster: us-east-0
          region: us-east
          instance: node-staging-1
      - targets: ["node-exporter:9100"]
        labels:
          environment: development
          cluster: eu-west-0
          region: eu-west
          instance: node-dev-1
