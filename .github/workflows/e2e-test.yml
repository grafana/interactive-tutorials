name: Optional PR E2E

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  preflight:
    # Skip unrelated comments and outsiders before allocating a runner.
    if: >-
      vars.PR_E2E_ENABLED == 'true' &&
      github.repository_id == '1040149225' &&
      github.event.issue.pull_request &&
      github.event.comment.user.type == 'User' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      contains(github.event.comment.body, '/e2e-test')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      PR_E2E_ALLOWED_ACTORS: ${{ vars.PR_E2E_ALLOWED_ACTORS }}
    outputs:
      submit: ${{ steps.command.outputs.submit }}
    steps:
      - name: Load helper from trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Check CODEOWNERS, current permission, command, and PR eligibility
        id: command
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/e2e-test.mjs preflight

  submit:
    needs: preflight
    if: needs.preflight.outputs.submit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    env:
      PR_E2E_ALLOWED_ACTORS: ${{ vars.PR_E2E_ALLOWED_ACTORS }}
    steps:
      - name: Load helper from trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Recheck authorization and capture current PR head
        id: command
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/e2e-test.mjs prepare

      - name: Obtain submitter identity token
        id: google-auth
        if: steps.command.outputs.submit == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/304398677251/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: pfe2e-pr-submitter@dev-advocacy-380120.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: https://pathfinder-pr-test-coordinator
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      - name: Submit request and report bounded response
        if: steps.command.outputs.submit == 'true'
        env:
          GOOGLE_ID_TOKEN: ${{ steps.google-auth.outputs.id_token }}
        run: node .github/scripts/e2e-test.mjs submit
