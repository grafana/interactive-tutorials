name: Validate optional PR E2E helper

on:
  pull_request:
    paths:
      - '.github/scripts/e2e-test*.mjs'
      - '.github/workflows/e2e-test.yml'
      - '.github/workflows/validate-e2e-workflow.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/e2e-test*.mjs'
      - '.github/workflows/e2e-test.yml'
      - '.github/workflows/validate-e2e-workflow.yml'

permissions:
  contents: read

jobs:
  test:
    # Ordinary unprivileged PR tests: no OIDC permission or execution credentials.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run parser and submission tests without cloud access
        run: node --test .github/scripts/e2e-test.test.mjs
