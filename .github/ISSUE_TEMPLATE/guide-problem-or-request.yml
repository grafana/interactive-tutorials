name: Guide problem or request
description: Report a problem in an existing guide, or request a change.
title: "[Guide] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the guides. A maintainer triages every issue. Only issues a maintainer labels `agent/ready` are open for outside implementation. See [CONTRIBUTING.md](https://github.com/grafana/interactive-tutorials/blob/main/CONTRIBUTING.md).

        Do not include secrets, tokens, or private data. Report security issues through [Grafana's security issue reporting page](https://grafana.com/legal/report-a-security-issue/).
  - type: input
    id: package
    attributes:
      label: Affected package or URL
      description: The package directory (for example `first-dashboard`) or the URL where you saw the guide.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Stack and product version
      description: Grafana version or Grafana Cloud, plus the Pathfinder plugin version if you know it.
    validations:
      required: true
  - type: input
    id: step
    attributes:
      label: Exact step or action
      description: The section and step text, or the action that failed.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Numbered steps from a clean state.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe public evidence
      description: Screenshots, console errors, or selectors. Remove anything private first.
    validations:
      required: false
